<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DigitalBox — warehouse order fulfillment. Upload packing slips, ship and cancel orders."
    />
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>DigitalBox</title>
    <script>
      // Set the colour scheme before first paint so there is no flash. Mirrors MUI's storage key.
      (function () {
        try {
          var mode = localStorage.getItem('mui-mode') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var cls = dark ? 'dark' : 'light';
          document.documentElement.classList.add(cls);
          document.documentElement.style.colorScheme = cls;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
