name: Deploy UI

# The Amplify app is manual-deploy (not connected to GitHub), so this workflow does what
# deploy.ps1 does: build with the production API URL, zip dist/, hand it to Amplify.
# AWS auth is OIDC into a role scoped to this repo's master branch and to Amplify
# create/start deployment on this one app.

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ui
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AMPLIFY_APP_ID: d5fyu1cc9a713
  AMPLIFY_BRANCH: master
  VITE_API_BASE_URL: https://digitalbox-api.hendersonsoftwarelabs.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Check the API URL is in the bundle
        run: grep -rq 'digitalbox-api.hendersonsoftwarelabs.com' dist/assets/*.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::441627938519:role/digitalbox-ui-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Amplify
        run: |
          (cd dist && zip -qr ../dist.zip .)
          read -r JOB_ID UPLOAD_URL < <(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --query '[jobId, zipUploadUrl]' --output text)
          curl -fsS -X PUT -H "Content-Type: application/zip" --upload-file dist.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$JOB_ID" > /dev/null
          while true; do
            STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" --query 'job.summary.status' --output text)
            echo "status: $STATUS"
            case "$STATUS" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
            esac
            sleep 6
          done
